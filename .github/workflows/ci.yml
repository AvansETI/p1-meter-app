# Lint, typecheck, test, build and package. The job name `ci` is the status check required on
# main. Every push builds and verifies the deploy package; pushes to main also publish it to the
# rolling "main-latest" release, which the production server installs automatically
# (docs/design/2026-11-09-deployment.md).
# Actions are pinned by commit SHA; the version is in the trailing comment.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through publishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:signatures
      - run: pnpm check:licenses
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: shellcheck scripts/deploy/*.sh scripts/deploy/p1-meter-update

      - name: Package and verify with the server's update script
        run: |
          scripts/deploy/package.sh out
          scripts/deploy/p1-meter-update --dry-run --manifest out/manifest.json \
            --package "out/$(jq -r .file out/manifest.json)"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            out/manifest.json
            out/p1-meter-app-*.tar.gz
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: out

      - run: scripts/deploy/publish.sh out
        env:
          GH_TOKEN: ${{ github.token }}
